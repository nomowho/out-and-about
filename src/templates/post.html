<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Out and About｜我出去一下就回來</title>
<meta name="description" id="mdesc" content="">
<meta property="og:type" content="article">
<meta property="og:site_name" content="Out and About">
<meta property="og:title" id="ogt" content="">
<meta property="og:description" id="ogd" content="">
<meta property="og:image" id="ogi" content="">
<link rel="canonical" id="canon" href="">
<script type="application/ld+json" id="ld"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,700&family=Montserrat:wght@300;500;700;800&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+JP:wght@500&display=swap" rel="stylesheet">
<style>
:root{--white:#FFFFFF;--ink:#111111;--gray:#767676;--hair:#DADADA;--mist:#EDEFF5;--butter:#FBF5D8;--w:1170px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--white);color:var(--ink);font-family:'Noto Sans TC',sans-serif;font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
img{display:block;width:100%;height:100%;object-fit:cover}
h1,h2,h3{text-wrap:balance}
.box{max-width:var(--w);margin:0 auto;padding:0 24px}
.en{font-family:'Montserrat',sans-serif}

/* 刊頭 */
.head{position:sticky;top:0;z-index:20;background:var(--white)}
.head .bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:12px 24px 4px}
.head .tools{display:flex;gap:22px;font-size:12px}
.head .tools.r{justify-content:flex-end}
.head button{background:none;border:0;cursor:pointer;font:inherit}
.logo{text-align:center;line-height:1}
.logo b{font-family:'Bodoni Moda',serif;font-weight:700;font-size:26px;letter-spacing:-.01em;display:block}
.logo small{font-size:13.5px;letter-spacing:.28em;color:#999;display:block;margin-top:5px}
.nav{max-width:var(--w);margin:0 auto;display:flex;justify-content:center;gap:36px;padding:8px 24px 10px;border-bottom:1px solid var(--ink);font-family:'Montserrat',sans-serif;font-weight:500;font-size:12px;letter-spacing:.16em}
.nav a:hover{opacity:.5}
.progress{position:absolute;left:0;bottom:-1px;height:2px;background:var(--ink);width:0}

/* 封面：滿版照片，標題在下 */
.cover{height:min(78vh,760px);overflow:hidden;background:#ddd}
.cover img{animation:settle 1.6s cubic-bezier(.2,.7,.2,1)}
@keyframes settle{from{transform:scale(1.06)}to{transform:none}}
.covercap{max-width:var(--w);margin:8px auto 0;padding:0 24px;font-size:11px;color:var(--gray);text-align:right}

/* 直拍封面：左標題、右整張照片 */
.split{max-width:1240px;margin:0 auto;padding:40px 24px 0;display:grid;grid-template-columns:1fr minmax(0,min(44vw,calc(84vh * .75)));gap:64px;align-items:center}
.split .ahead{text-align:left;padding:0;margin:0;max-width:none}
.split .meta,.split .by{justify-content:flex-start}
.split h1{font-size:clamp(28px,3vw,42px)}
.split figure{aspect-ratio:3/4;max-height:84vh;overflow:hidden;background:#ddd}
.split figure img{object-position:50% 78%;animation:settle 1.6s cubic-bezier(.2,.7,.2,1)}
.split figcaption{font-size:11px;color:var(--gray);margin-top:8px}
.ahead{max-width:820px;margin:0 auto;text-align:center;padding:48px 24px 8px}
.meta{font-family:'Montserrat',sans-serif;font-size:12px;font-weight:500;display:flex;gap:10px;justify-content:center;align-items:baseline}
.meta time{color:var(--gray);font-weight:300}
.ahead h1{font-size:clamp(26px,3.4vw,40px);font-weight:700;line-height:1.45;margin:18px 0}
.ahead .dek{font-size:16px;line-height:1.95;color:#444;max-width:40em;margin:0 auto}
.by{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 22px;font-size:12px;color:var(--gray);margin-top:24px;padding-top:18px;border-top:1px solid var(--hair)}
.by b{color:var(--ink);font-weight:500}

/* 目次 */
.toc{max-width:680px;margin:40px auto 0;padding:0 24px}
.toc .in{background:var(--mist);padding:18px 24px}
.toc h2{font-family:'Montserrat',sans-serif;font-size:12px;font-weight:700;letter-spacing:.1em;margin-bottom:6px}
.toc ol{list-style:none;counter-reset:t}
.toc li{counter-increment:t;font-size:14px;padding:4px 0}
.toc li::before{content:counter(t,decimal-leading-zero);font-family:'Montserrat',sans-serif;font-size:11px;color:var(--gray);margin-right:12px}
.toc a:hover{text-decoration:underline}

/* 內文 */
.body{max-width:680px;margin:48px auto 0;padding:0 24px}
.body > p{font-size:16.5px;line-height:2.05;margin-bottom:1.3em;letter-spacing:.02em}
.body > p:first-child::first-letter{font-size:3.1em;font-weight:700;float:left;line-height:1;margin:.12em .12em 0 0}
.body h2{font-size:21px;font-weight:700;line-height:1.5;margin:56px 0 16px;padding-top:18px;border-top:1px solid var(--ink);scroll-margin-top:110px}
.body figure{margin:36px 0}
.body figcaption{font-size:12px;color:var(--gray);margin-top:8px;line-height:1.7}
.body .wide{width:min(980px,calc(100vw - 48px));margin-left:50%;transform:translateX(-50%)}
.body .wide img{aspect-ratio:3/2;height:auto}
.body .full{width:100vw;margin-left:50%;transform:translateX(-50%)}
.body .full img{height:min(85vh,820px)}
.body .full figcaption{max-width:var(--w);margin:8px auto 0;padding:0 24px}
.body .side{float:right;width:46%;margin:6px -12% 24px 32px}
.body .side img{aspect-ratio:3/4;height:auto}
.body .pair{width:min(980px,calc(100vw - 48px));margin-left:50%;transform:translateX(-50%)}
.body .pair .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.body .pair img{aspect-ratio:4/5;height:auto}
.body h2,.body .wide,.body .full,.body .pair,.body .side{clear:both}
.body blockquote{text-align:center;margin:40px 0;padding:36px 0;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}
.body blockquote p{font-family:'Noto Serif JP',serif;font-size:clamp(22px,2.6vw,30px);letter-spacing:.12em;line-height:1.6}
.body blockquote cite{display:block;font-style:normal;font-size:13px;color:var(--gray);margin-top:14px}

/* 路線：依序經過的地點 */
.body .route{list-style:none;margin:28px 0 36px;border-left:1px solid var(--ink);padding-left:0;counter-reset:r}
.body .route li{position:relative;padding:0 0 18px 30px;counter-increment:r}
.body .route li::before{content:counter(r,decimal-leading-zero);position:absolute;left:-15px;top:1px;width:30px;height:22px;background:var(--white);font-family:'Montserrat',sans-serif;font-size:11px;font-weight:700;text-align:center;line-height:22px}
.body .route b{display:block;font-size:16px;font-weight:700}
.body .route span{display:block;font-size:14.5px;color:#444;line-height:1.85;margin-top:2px}
.body .route li:last-child{padding-bottom:0}

/* 旅行資訊 */
.info{max-width:680px;margin:64px auto 0;padding:0 24px;clear:both}
.info .in{border-top:3px double var(--ink);border-bottom:3px double var(--ink);padding:18px 0 8px}
.info h2,.qa h2{display:flex;align-items:baseline;gap:12px;margin-bottom:8px}
.info h2 .en,.qa h2 .en{font-family:'Montserrat',sans-serif;font-weight:800;font-size:24px}
.info h2 span:last-child,.qa h2 span:last-child{font-size:14px;font-weight:500}
.info dl{display:grid;grid-template-columns:7em 1fr}
.info dt,.info dd{font-size:14px;padding:11px 0;border-top:1px solid var(--hair);line-height:1.75}
.info dt{color:var(--gray)}
.info .note{font-size:11.5px;color:var(--gray);padding:10px 0}

.qa{max-width:680px;margin:56px auto 0;padding:0 24px}
.qa dt{font-size:16.5px;font-weight:700;line-height:1.7;padding:18px 0 6px 34px;position:relative;border-top:1px solid var(--hair)}
.qa dd{font-size:15.5px;line-height:1.95;color:#333;padding:0 0 18px 34px;position:relative}
.qa dt::before,.qa dd::before{position:absolute;left:0;font-family:'Montserrat',sans-serif;font-weight:800;font-size:17px}
.qa dt::before{content:'Q';top:18px}
.qa dd::before{content:'A';top:0;color:var(--gray)}
.refs{max-width:680px;margin:56px auto 0;padding:0 24px}
.refs h2{display:flex;align-items:baseline;gap:12px;margin-bottom:8px}
.refs h2 .en{font-family:'Montserrat',sans-serif;font-weight:800;font-size:24px}
.refs h2 span:last-child{font-size:14px;font-weight:500}
.refs ol{list-style:decimal;padding-left:1.4em}
.refs li{font-size:14px;line-height:1.8;padding:9px 0;border-top:1px solid var(--hair)}
.refs li a{text-decoration:underline;text-underline-offset:3px;word-break:break-word}
.refs li span{display:block;font-size:12.5px;color:var(--gray)}

/* 原刊 IG */
.orig{max-width:680px;margin:56px auto 0;padding:0 24px}
.orig .in{background:var(--butter);display:flex;align-items:center;gap:20px;padding:20px 24px}
.orig p{font-size:14px;line-height:1.7;flex:1}
.orig p b{display:block;font-family:'Montserrat',sans-serif;font-size:11px;letter-spacing:.1em}
.orig a{border:1px solid var(--ink);padding:10px 16px;font-family:'Montserrat',sans-serif;font-size:12px;font-weight:500;white-space:nowrap;background:var(--white)}
.orig a:hover{background:var(--ink);color:var(--white)}

.more{margin-top:96px;padding:56px 0 64px;background:var(--mist)}
.sh{display:flex;align-items:baseline;gap:16px;margin-bottom:28px}
.sh h2{font-family:'Montserrat',sans-serif;font-weight:800;font-size:30px;line-height:1}
.sh span{font-size:14px;font-weight:500}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.card figure{aspect-ratio:3/2;overflow:hidden;background:#ddd}
.card img{transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.card:hover img{transform:scale(1.04)}
.card .meta{justify-content:flex-start;margin-top:12px;font-size:11.5px}
.card h3{font-size:15px;font-weight:700;line-height:1.65;margin-top:5px}


/* 沒照片時的暫代文字卡 */
.ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;padding:18px 20px;background:linear-gradient(150deg,#e9ebee 0%,#d3d6db 55%,#c4c8ce 100%);color:#2b2e33}
.ph span{font-family:'Montserrat',sans-serif;font-size:10.5px;font-weight:700;letter-spacing:.12em;color:#5d6168}
.ph b{font-size:22px;font-weight:700;line-height:1.3}
.ph i{font-style:normal;font-size:11px;color:#6b6f75}
figure:has(.ph){position:relative}

.ahead.noimg{padding-top:72px;border-bottom:1px solid var(--hair);padding-bottom:36px}

/* 尚未改寫成長文 */
.pending{max-width:680px;margin:48px auto 0;padding:0 24px;text-align:center}
.pending p{font-size:15px;color:#444;line-height:1.9}
.pending a{display:inline-block;margin-top:20px;border:1px solid var(--ink);padding:12px 20px;font-family:'Montserrat',sans-serif;font-size:13px}

footer{background:var(--ink);color:#fff;padding:44px 24px 36px;text-align:center;margin-top:0}
footer p{font-size:11px;color:#999;font-family:'Montserrat',sans-serif;margin-top:16px}

@media(max-width:900px){
  .split{grid-template-columns:1fr;gap:28px;padding-top:0}
  .split figure{order:-1;max-height:none;margin:0 -24px}
  .split figcaption{order:-1;margin-top:-20px}
  .body .side{float:none;width:100%;margin:36px 0}
  .grid{grid-template-columns:1fr 1fr;gap:22px 14px}
}
@media(max-width:700px){
  .head .bar{padding:10px 16px 4px}.head .tools span{display:none}
  .nav{justify-content:flex-start;overflow-x:auto;gap:24px;padding:8px 16px;white-space:nowrap;scrollbar-width:none}
  .cover{height:62vh}
  .ahead{padding-top:32px;text-align:left}.meta,.by{justify-content:flex-start}
  .body > p{font-size:16px}
  .body .wide,.body .pair{width:100vw}
  .body .pair .two{gap:4px}
  .info dl{grid-template-columns:5.5em 1fr}
  .orig .in{flex-direction:column;align-items:flex-start}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="head">
  <div class="bar">
    <div class="tools"><button aria-label="開啟選單">☰ <span>Menu</span></button></div>
    <a class="logo" href="d-magazine.html"><b>Out and About</b><small>我出去一下就回來</small></a>
    <div class="tools r"><a class="en" href="https://www.instagram.com/nomowho/">Instagram</a></div>
  </div>
  <nav class="nav" aria-label="分類">
    <a href="d-magazine.html#latest-news">NEWS</a><a href="category.html#ARCHITECTURE">ARCHITECTURE</a><a href="category.html#ART">ART</a><a href="category.html#HISTORY">HISTORY</a><a href="category.html#NATURE">NATURE</a><a href="category.html#FAITH">FAITH</a><a href="category.html#FOOD">FOOD</a><a href="category.html#GUIDE">GUIDE</a>
  </nav>
  <div class="progress" id="progress"></div>
</header>

<main id="main"></main>

<footer>
  <a class="logo" href="d-magazine.html"><b>Out and About</b></a>
  <p>© 2026 Nomo · Text &amp; photography by Nomo</p>
</footer>

<script src="posts-data.js"></script>
<script src="post-data.js"></script>
<script>
const SITE = 'https://nomowho.github.io/out-and-about/';   // 正式網址待定
const main = document.getElementById('main');
const iso = d => d.replace(/\./g, '-');
const igUrl = id => { const x = POSTS.find(q => q.id === id); return x && x.ig ? `https://www.instagram.com/nomowho/p/${x.ig}/` : 'https://www.instagram.com/nomowho/'; };
const AREA_EN = { '青森':'AOMORI','岩手':'IWATE','宮城':'MIYAGI','山形':'YAMAGATA','愛知':'AICHI','東京':'TOKYO','靜岡':'SHIZUOKA' };
const areaEn = p => AREA_EN[p.area] || p.area.toUpperCase();

function block(b) {
  if (b.t === 'p') return `<p>${b.text}</p>`;
  if (b.t === 'h') return `<h2 id="${b.id}">${b.text}</h2>`;
  if (b.t === 'route') return `<ol class="route">${b.items.map(([n, d]) => `<li><b>${n}</b><span>${d}</span></li>`).join('')}</ol>`;
  if (b.t === 'quote') return `<blockquote><p lang="ja">${b.text}</p>${b.note ? `<cite>${b.note}</cite>` : ''}</blockquote>`;
  if (b.t === 'img') return `<figure class="${b.size || 'wide'}"><img src="${b.src}" alt="${b.cap || ''}" loading="lazy">${b.cap ? `<figcaption>${b.cap}</figcaption>` : ''}</figure>`;
  if (b.t === 'pair') return `<figure class="pair"><div class="two">${b.imgs.map(s => `<img src="${s}" alt="" loading="lazy">`).join('')}</div>${b.cap ? `<figcaption>${b.cap}</figcaption>` : ''}</figure>`;
  return '';
}
const card = p => `
  <a class="card" href="post.html#${p.id}">
    <figure>${thumb(p)}</figure>
    <div class="meta"><span>${p.cat}</span><time>${p.date}</time></div>
    <h3>${p.title}</h3>
  </a>`;

function setMeta(p, d, title, desc, cover) {
  const url = SITE + 'stories/' + p.id;
  document.title = `${title}｜Out and About`;
  document.getElementById('mdesc').content = desc;
  document.getElementById('ogt').content = title;
  document.getElementById('ogd').content = desc;
  document.getElementById('ogi').content = cover;
  document.getElementById('canon').href = url;
  const ld = [
    { '@context':'https://schema.org', '@type':'BlogPosting', headline:title, description:desc, image:[cover],
      inLanguage:'zh-Hant-TW', datePublished:iso(p.date), mainEntityOfPage:url,
      author:{ '@type':'Person', name:'Nomo', url:'https://www.instagram.com/nomowho/' },
      publisher:{ '@type':'Organization', name:'Out and About', url:SITE },
      about:{ '@type':'TouristAttraction', name:p.zh, address:{ '@type':'PostalAddress', addressRegion:p.area, addressCountry:p.region } } },
    { '@context':'https://schema.org', '@type':'BreadcrumbList', itemListElement:[
      { '@type':'ListItem', position:1, name:'Out and About', item:SITE },
      { '@type':'ListItem', position:2, name:p.cat, item:SITE + p.cat.toLowerCase() + '/' },
      { '@type':'ListItem', position:3, name:title, item:url } ] }
  ];
  if (d && d.faq) ld.push({ '@context':'https://schema.org', '@type':'FAQPage',
    mainEntity:d.faq.map(([q, a]) => ({ '@type':'Question', name:q, acceptedAnswer:{ '@type':'Answer', text:a } })) });
  document.getElementById('ld').textContent = JSON.stringify(ld);
}

function render() {
  const id = decodeURIComponent(location.hash.slice(1));
  const p = POSTS.find(x => x.id === id);
  if (!p) { main.innerHTML = `<div class="pending"><p>找不到這篇文章。</p><a href="d-magazine.html">回首頁</a></div>`; return; }
  const d = POST_DETAIL[id];
  const title = d ? d.seoTitle : p.title;
  const cover = d ? (d.cover || null) : (p.photo === false ? null : `img/${p.id}.jpg`);
  const desc = d ? d.dek : `${p.title}。${p.zh}，${p.area}。`;
  setMeta(p, d, title, desc, cover);
  const related = POSTS.filter(x => x.id !== id && (x.region === p.region)).slice(0, 3);

  const head = `
      <div class="meta"><span>${p.cat} · ${areaEn(p)}</span><time datetime="${iso(p.date)}">${p.date}</time></div>
      <h1>${title}</h1>
      ${d ? `<p class="dek">${d.dek}</p>` : ''}
      <div class="by"><span>文・攝影｜<b>Nomo</b></span>${d && d.visit ? `<span>造訪｜${d.visit}</span>` : ''}<span>地點｜${p.zh}，${p.area}</span></div>`;
  const split = d && d.coverLayout === 'split';
  const top = !cover
    ? `<header class="ahead noimg">${head}</header>`
    : split
    ? `<section class="split"><header class="ahead">${head}</header><figure><img src="${cover}" alt="${p.zh}">${d.coverCap ? `<figcaption>${d.coverCap}</figcaption>` : ''}</figure></section>`
    : `<div class="cover"><img src="${cover}" alt="${p.zh}"></div>${d && d.coverCap ? `<p class="covercap">${d.coverCap}</p>` : ''}<header class="ahead">${head}</header>`;
  main.innerHTML = top + `
    ${d ? `
      <nav class="toc" aria-label="目次"><div class="in"><h2>CONTENTS 目次</h2><ol>
        ${d.body.filter(b => b.t === 'h').map(b => `<li><a href="#${b.id}" data-anchor>${b.text}</a></li>`).join('')}
        <li><a href="#info" data-anchor>旅行資訊</a></li><li><a href="#qa" data-anchor>常見問題</a></li>
      </ol></div></nav>
      <article class="body">${d.body.map(block).join('')}</article>
      ${d.info ? `<section class="info" id="info"><div class="in"><h2><span class="en">Travel Info</span><span>旅行資訊</span></h2><dl>${d.info.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl><p class="note">開放時間與費用可能調整，出發前請以官方公告為準。</p></div></section>` : ''}
      ${d.faq ? `<section class="qa" id="qa"><h2><span class="en">Q&amp;A</span><span>常見問題</span></h2><dl>${d.faq.map(([q, a]) => `<dt>${q}</dt><dd>${a}</dd>`).join('')}</dl></section>` : ''}
    ` : `<div class="pending"><p>這篇的網站長文版正在整理中。<br>先到 Instagram 看原本的圖卡與貼文。</p><a href="${igUrl(id)}" target="_blank" rel="noopener">在 Instagram 看這篇</a></div>`}
    ${d ? `<aside class="orig"><div class="in"><p><b>ORIGINALLY ON INSTAGRAM</b>這篇最早以圖卡形式發在 @nomowho，網站版補上了交通、時間與常見問題。</p><a href="${igUrl(id)}" target="_blank" rel="noopener">看 IG 原貼文</a></div></aside>` : ''}
    ${related.length ? `<section class="more"><div class="box">
      <div class="sh"><h2>More Stories</h2><span>同一個國家的其他旅行</span></div>
      <div class="grid">${related.map(card).join('')}</div>
    </div></section>` : ''}`;
  scrollTo(0, 0);
  // 目次錨點在 hash 路由下改用捲動，避免換掉文章 id
  main.querySelectorAll('[data-anchor]').forEach(a => a.addEventListener('click', e => {
    e.preventDefault();
    document.getElementById(a.getAttribute('href').slice(1)).scrollIntoView({ behavior: 'smooth' });
  }));
}
// 一篇一個檔：需要時才載入 articles/<id>.js，沒有這個檔就顯示「長文整理中」
function load() {
  const id = decodeURIComponent(location.hash.slice(1));
  if (!id || POST_DETAIL[id] || !POSTS.find(x => x.id === id)) return render();
  const s = document.createElement('script');
  s.src = 'articles/' + encodeURIComponent(id) + '.js';
  s.onload = s.onerror = render;
  document.head.appendChild(s);
}
addEventListener('hashchange', load);
load();

const bar = document.getElementById('progress');
addEventListener('scroll', () => {
  const h = document.documentElement.scrollHeight - innerHeight;
  bar.style.width = (h > 0 ? scrollY / h * 100 : 0) + '%';
}, { passive: true });
</script>
</body>
</html>
